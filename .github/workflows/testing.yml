name: Test & Check Code Quality

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/**"
      - ".pre-commit-config.yaml"
      - "config*.yaml"
      - "problems/**"
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "serve/*.py"
      - "serve/*.sh"
      - "serve/*.slurm"
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/**"
      - ".pre-commit-config.yaml"
      - "config*.yaml"
      - "problems/**"
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "serve/*.py"
      - "serve/*.sh"
      - "serve/*.slurm"
  workflow_call:

jobs:
  check_code_quality:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: |
          uv sync --locked --extra quality
      - name: Check quality
        run: |
          uv run ruff check tests src scripts serve
          uv run ruff format --check tests src scripts serve

  test:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: |
          uv sync --locked --extra testing
      - name: Test with pytest
        env:
          PYTHONFAULTHANDLER: 1
          MPLBACKEND: Agg
        run: |
          uv run python -m pytest ./tests/ --cov=physics_intern --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html:htmlcov
      - name: Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: warn
